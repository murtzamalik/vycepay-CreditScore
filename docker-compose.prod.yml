# VyceScore production compose — app containers only.
# Postgres + Redis run on the DB host; set DATABASE_URL / REDIS_URL in .env.
name: vycescore

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vycescore-backend:local
    container_name: vycescore-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: vycescore-frontend:local
    container_name: vycescore-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
