name: Security — Weekly Vulnerability Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com

jobs:
  # ---------------------------------------------------------------------------
  # Trivy: Scan source code and IaC
  # ---------------------------------------------------------------------------
  trivy-source:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-filesystem"
        if: always()

  # ---------------------------------------------------------------------------
  # Trivy: Scan Terraform/IaC for misconfigurations
  # ---------------------------------------------------------------------------
  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "infrastructure/"
          format: "sarif"
          output: "trivy-iac.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy IaC results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-iac.sarif"
          category: "trivy-iac"
        if: always()

  # ---------------------------------------------------------------------------
  # Trivy: Scan container images
  # ---------------------------------------------------------------------------
  trivy-images:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - vycescore-api
          - vycescore-admin
          - vycescore-ml
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ matrix.image }}:main"
          format: "sarif"
          output: "trivy-image-${{ matrix.image }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-${{ matrix.image }}.sarif"
          category: "trivy-image-${{ matrix.image }}"
        if: always()

  # ---------------------------------------------------------------------------
  # Snyk: Dependency vulnerability scan
  # ---------------------------------------------------------------------------
  snyk-python:
    name: Snyk Python Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snyk Python test
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=requirements.txt
        continue-on-error: true

      - name: Snyk monitor
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --file=requirements.txt

  snyk-node:
    name: Snyk Node Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snyk Node test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=frontend/package.json
        continue-on-error: true

      - name: Snyk monitor
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --file=frontend/package.json

  # ---------------------------------------------------------------------------
  # Summary report
  # ---------------------------------------------------------------------------
  report:
    name: Security Report
    needs: [trivy-source, trivy-iac, trivy-images, snyk-python, snyk-node]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security scan summary
        run: |
          echo "## Weekly Security Scan Complete"
          echo "Results uploaded to GitHub Security tab."
          echo "Review findings at: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
