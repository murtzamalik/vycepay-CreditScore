name: CD — Build, Push, Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com

jobs:
  # ---------------------------------------------------------------------------
  # Build and push Docker images to ECR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: vycescore-api
            context: .
            dockerfile: infrastructure/docker/backend/Dockerfile
          - name: vycescore-admin
            context: ./frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
          - name: vycescore-ml
            context: .
            dockerfile: infrastructure/docker/ml/Dockerfile
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  # ---------------------------------------------------------------------------
  # Deploy to Staging (automatic on main push)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging-api.vycescore.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name staging-vycescore --region ${{ env.AWS_REGION }}

      - name: Deploy via ArgoCD sync
        run: |
          # Update image tag in ArgoCD application
          argocd app set vycescore-staging \
            --parameter image.tag=${{ github.sha }} \
            --grpc-web
          argocd app sync vycescore-staging --grpc-web --prune --force
          argocd app wait vycescore-staging --grpc-web --timeout 300

      - name: Smoke test
        run: |
          echo "Running smoke tests against staging..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.vycescore.com/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying..."
            sleep 10
          done
          echo "Smoke test failed after 30 attempts."
          exit 1

  # ---------------------------------------------------------------------------
  # Deploy to Production (manual approval required)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.vycescore.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name production-vycescore --region ${{ env.AWS_REGION }}

      - name: Deploy via ArgoCD sync (canary)
        run: |
          argocd app set vycescore-production \
            --parameter image.tag=${{ github.sha }} \
            --grpc-web
          argocd app sync vycescore-production --grpc-web --prune
          argocd app wait vycescore-production --grpc-web --timeout 600

      - name: Production smoke test
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.vycescore.com/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed."
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying..."
            sleep 10
          done
          echo "Production smoke test failed."
          exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "Production deployment of ${{ github.sha }} completed successfully."
          # Add Slack/Teams notification here
