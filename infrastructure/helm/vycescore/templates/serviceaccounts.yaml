###############################################################################
# Service Accounts — IRSA-annotated for AWS IAM role binding
###############################################################################

{{- $backendApi := .Values.services.backendApi -}}
{{- if and $backendApi.enabled $backendApi.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $backendApi.serviceAccount.name | default "scoring-service" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vycescore.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend-api
  {{- with $backendApi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}

---
{{- $mlServing := .Values.services.mlServing -}}
{{- if and $mlServing.enabled $mlServing.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $mlServing.serviceAccount.name | default "scoring-service" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vycescore.labels" . | nindent 4 }}
    app.kubernetes.io/name: ml-serving
  {{- with $mlServing.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}

---
{{- $worker := .Values.services.worker -}}
{{- if and $worker.enabled $worker.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $worker.serviceAccount.name | default "batch-worker" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vycescore.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
  {{- with $worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
