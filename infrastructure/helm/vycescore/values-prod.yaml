# VyceScore — Production Environment Values

namespace: vycescore
environment: production

config:
  LOG_LEVEL: "WARNING"
  API_DOCS_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://admin.vycescore.com"
  DB_POOL_SIZE: "50"
  DB_MAX_OVERFLOW: "25"
  BATCH_SCHEDULE_CRON: "0 3 * * *"

blueGreen:
  enabled: true
  activeSlot: blue

ingress:
  enabled: true
  className: nginx
  apiHost: api.vycescore.com
  adminHost: admin.vycescore.com
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "1; mode=block" always;
  tls:
    - secretName: vycescore-api-tls
      hosts:
        - api.vycescore.com
    - secretName: vycescore-admin-tls
      hosts:
        - admin.vycescore.com

services:
  backendApi:
    enabled: true
    replicas: 3
    image:
      repository: "${AWS_ACCOUNT_ID}.dkr.ecr.af-south-1.amazonaws.com/vycescore-api"
      tag: latest
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      targetCPU: 65
      targetMemory: 75
    pdb:
      minAvailable: 2
    serviceAccount:
      create: true
      name: scoring-service
      annotations:
        eks.amazonaws.com/role-arn: ""

  frontend:
    enabled: true
    replicas: 2
    apiUrl: "https://api.vycescore.com"
    image:
      repository: "${AWS_ACCOUNT_ID}.dkr.ecr.af-south-1.amazonaws.com/vycescore-admin"
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPU: 70
    pdb:
      minAvailable: 1

  mlServing:
    enabled: true
    replicas: 3
    image:
      repository: "${AWS_ACCOUNT_ID}.dkr.ecr.af-south-1.amazonaws.com/vycescore-ml"
      tag: latest
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPU: 55
      targetMemory: 70
    pdb:
      minAvailable: 2
    nodeSelector:
      workload: ml-inference
    tolerations:
      - key: workload
        value: ml-inference
        effect: NoSchedule

  worker:
    enabled: true
    replicas: 2
    image:
      repository: "${AWS_ACCOUNT_ID}.dkr.ecr.af-south-1.amazonaws.com/vycescore-api"
      tag: latest
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
