# VyceScore Platform — Default Helm Values
# Override per environment via values-{env}.yaml

namespace: vycescore
environment: dev

# ---------------------------------------------------------------------------
# Global Config (injected as ConfigMap)
# ---------------------------------------------------------------------------
config:
  APP_NAME: "vycescore"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  API_VERSION: "v1"
  API_DOCS_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://admin.vycescore.com"
  SCORE_MIN: "300"
  SCORE_MAX: "900"
  SCORE_CACHE_TTL_SECONDS: "86400"
  SHAP_TOP_N_DRIVERS: "3"
  BATCH_SCHEDULE_CRON: "0 3 * * *"
  FEATURE_STORE_FORMAT: "parquet"
  RATE_LIMIT_LITE_RPM: "600"
  RATE_LIMIT_PRO_RPM: "120"
  RATE_LIMIT_BATCH_RPM: "10"
  DB_PORT: "5432"
  DB_NAME: "vycescore"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SSL: "true"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  DATA_RETENTION_YEARS: "10"
  AUDIT_LOG_ENABLED: "true"
  PII_ENCRYPTION_ENABLED: "true"

# ---------------------------------------------------------------------------
# Blue-Green Deployment
# ---------------------------------------------------------------------------
blueGreen:
  enabled: false
  activeSlot: blue   # "blue" or "green"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  apiHost: api.vycescore.com
  adminHost: admin.vycescore.com
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: vycescore-api-tls
      hosts:
        - api.vycescore.com
    - secretName: vycescore-admin-tls
      hosts:
        - admin.vycescore.com

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # --- Backend API ---
  backendApi:
    enabled: true
    replicas: 2
    image:
      repository: ""  # Set per environment
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    serviceAccount:
      create: true
      name: scoring-service
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    pdb:
      minAvailable: 1
    nodeSelector: {}
    tolerations: []

  # --- Frontend (Admin Portal) ---
  frontend:
    enabled: true
    replicas: 2
    apiUrl: "https://api.vycescore.com"
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    serviceAccount:
      create: false
      name: default
      annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 4
      targetCPU: 70
    pdb:
      minAvailable: 1
    nodeSelector: {}
    tolerations: []

  # --- ML Serving ---
  mlServing:
    enabled: true
    replicas: 2
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: scoring-service
      annotations: {}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 60
      targetMemory: 75
    pdb:
      minAvailable: 1
    nodeSelector:
      workload: ml-inference
    tolerations:
      - key: workload
        value: ml-inference
        effect: NoSchedule

  # --- Worker (Batch Processor) ---
  worker:
    enabled: true
    replicas: 1
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: batch-worker
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
