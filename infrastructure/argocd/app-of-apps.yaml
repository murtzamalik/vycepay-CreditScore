###############################################################################
# VyceScore — ArgoCD App-of-Apps
# Root application that manages all environment-specific applications
###############################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vycescore-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: vycescore
    app.kubernetes.io/part-of: vycescore-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vycescore
  source:
    repoURL: https://github.com/vycepay/vycescore.git
    targetRevision: main
    path: infrastructure/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
