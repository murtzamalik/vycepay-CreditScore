apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vycescore-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: vycescore
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: vycescore-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vycescore
  source:
    repoURL: https://github.com/vycepay/vycescore.git
    targetRevision: main
    path: infrastructure/helm/vycescore
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vycescore
  # Production: NO automated sync — manual approval required
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
