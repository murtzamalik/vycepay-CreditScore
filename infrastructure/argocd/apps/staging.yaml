apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vycescore-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: vycescore
    app.kubernetes.io/instance: staging
    app.kubernetes.io/part-of: vycescore-platform
    environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vycescore
  source:
    repoURL: https://github.com/vycepay/vycescore.git
    targetRevision: main
    path: infrastructure/helm/vycescore
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vycescore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
