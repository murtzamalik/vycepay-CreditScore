apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vycescore

resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml

commonLabels:
  environment: staging

patches:
  - target:
      kind: ConfigMap
      name: vycescore-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "INFO"
      - op: replace
        path: /data/API_DOCS_ENABLED
        value: "true"
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "https://staging-admin.vycescore.com"
