apiVersion: v1
kind: ConfigMap
metadata:
  name: vycescore-config
  namespace: vycescore
  labels:
    app.kubernetes.io/name: vycescore
    app.kubernetes.io/part-of: vycescore-platform
data:
  # Application settings
  APP_NAME: "vycescore"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # API settings
  API_VERSION: "v1"
  API_DOCS_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://admin.vycescore.com"

  # Scoring settings
  SCORE_MIN: "300"
  SCORE_MAX: "900"
  SCORE_CACHE_TTL_SECONDS: "86400"   # 24 hours
  SHAP_TOP_N_DRIVERS: "3"

  # Feature engineering
  BATCH_SCHEDULE_CRON: "0 2 * * *"   # Daily at 02:00 UTC
  FEATURE_STORE_FORMAT: "parquet"

  # Rate limiting defaults
  RATE_LIMIT_LITE_RPM: "600"
  RATE_LIMIT_PRO_RPM: "120"
  RATE_LIMIT_BATCH_RPM: "10"

  # Database
  DB_PORT: "5432"
  DB_NAME: "vycescore"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"

  # Redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SSL: "true"

  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"

  # Compliance
  DATA_RETENTION_YEARS: "10"
  AUDIT_LOG_ENABLED: "true"
  PII_ENCRYPTION_ENABLED: "true"
