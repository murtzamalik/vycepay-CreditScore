apiVersion: v1
kind: Namespace
metadata:
  name: vycescore
  labels:
    app.kubernetes.io/name: vycescore
    app.kubernetes.io/part-of: vycescore-platform
  annotations:
    description: "VyceScore credit scoring engine workloads"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vycescore-quota
  namespace: vycescore
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vycescore-limits
  namespace: vycescore
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vycescore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: vycescore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vycescore
